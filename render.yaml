services:
  - type: web
    name: insurance-fraud-detector
    runtime: python
    runtimeVersion: "3.11"
    rootDir: .
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ENV
        value: production
      - key: CORS_ORIGINS
        value: "*"
    healthCheckPath: /api/health
    memoryLimit: 512
    cpuCount: 0.5
